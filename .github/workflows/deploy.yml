name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  # 每天重建一次:镜像大小 / SHA256 / WSL 版本在构建时从 GitCode 与 GitHub 现取,
  # 所以发新版镜像后即使没人改源码,站点数字也会自己跟上。
  schedule:
    - cron: "0 3 * * *" # UTC 03:00 = 北京时间 11:00
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 取不到就沿用仓库里的 src/data/releases.json 快照,构建不会因此失败。
      - name: Refresh release data (ISO + WSL)
        run: npm run fetch:data

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
